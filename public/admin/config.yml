# Configuracao do Sveltia CMS (painel do dono da loja).
# Os campos abaixo correspondem 1:1 ao schema Zod da Content Collection do Astro
# em src/content/config.ts (via src/content/produto-schema.ts).

backend:
  name: github
  repo: seu_usuario/seu-repo  # TROQUE para o seu usuario/repo no GitHub
  branch: main
  # URL do Worker de autenticacao (sveltia-cms-auth) ja deployado.
  # E ele que faz o login OAuth da conta GitHub de quem for editar o conteudo.
  base_url: https://sveltia-cms-auth.SEU_USUARIO.workers.dev  # TROQUE apos deployar seu proprio worker de auth

# Idioma do painel
locale: pt

# ---- FOTOS: pasta publica + otimizacao no UPLOAD ----
# As fotos vao para public/uploads/ e sao referenciadas por URL publica
# (ex.: /uploads/foo.webp). Ficam em /public (servidas como estao), entao o
# BUILD NUNCA processa a imagem — um upload ruim nao tem como quebrar o deploy.
# (Ja quebrou 3x quando a foto passava pelo image() do Astro, que hard-faila.)
media_folder: "public/uploads"
public_folder: "/uploads"

# Otimizacao feita no NAVEGADOR, no momento do upload (recurso do Sveltia):
# toda foto enviada e convertida para WebP e redimensionada. Assim a foto de
# 4000px / 4 MB do celular do dono da loja vira ~1 MP / poucos KB automaticamente,
# antes mesmo de ir para o repositorio.
media_libraries:
  default:
    config:
      # bloqueia arquivos absurdamente grandes (antes da otimizacao). 12 MB.
      max_file_size: 12582912
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1400
          height: 1400

collections:
  - name: produtos
    label: "Produtos"
    label_singular: "Produto"
    description: "Cadastro de doces do cardapio. Edite nome, preco, foto e disponibilidade."
    # Entradas PLANAS: cada produto e um arquivo unico src/content/produtos/<slug>.md
    # (formato padrao de folder collection — o Sveltia LISTA estas entradas).
    # NAO use subpastas por produto (path: "{{slug}}/index") nem coloque imagens
    # dentro desta pasta: ja causou o painel parar de listar e/ou o build quebrar.
    folder: "src/content/produtos"
    create: true
    # o arquivo de cada produto e nomeado a partir do nome
    identifier_field: nome
    slug: "{{slug}}"
    fields:
      - { name: nome, label: "Nome", widget: string }
      - { name: descricao, label: "Descrição", widget: text, required: false }
      - {
          name: preco,
          label: "Preço (R$)",
          widget: number,
          value_type: float,
          min: 0,
          step: 0.5,
          hint: "Use ponto para centavos. Ex.: 14 ou 4.5",
        }
      # Categoria vem da collection "categorias" (widget relation), para o dono da loja
      # poder CADASTRAR novas categorias pelo painel (secao "Categorias") sem
      # mexer no codigo. O valor gravado continua sendo o texto do nome
      # (ex.: "Brownie"), igual ao que o select fazia — o schema nao muda.
      - {
          name: categoria,
          label: "Categoria",
          widget: relation,
          collection: categorias,
          value_field: nome,
          search_fields: [nome],
          display_fields: [nome],
          hint: "Escolha a categoria. Para criar novas, use a seção Categorias no menu lateral.",
        }
      # --- ANTES: lista fixa de categorias (substituida pelo relation acima).
      #     Mantido comentado para referencia / rollback rapido.
      # - {
      #     name: categoria,
      #     label: "Categoria",
      #     widget: select,
      #     options: ["Brownie", "Brigadeiro", "Bolo de Pote", "Cookies"],
      #   }
      - {
          name: disponivel,
          label: "Disponível",
          widget: boolean,
          default: true,
          hint: "Desligue para mostrar o produto como Esgotado.",
        }
      # "Esconder do Cardápio": esconde o produto do site (grade e página de
      # detalhe) sem apagar nada — nome, descrição, preço e foto continuam
      # aqui, só não aparecem para o cliente. Diferente de "Disponível": um
      # produto indisponível ainda aparece no site com o selo "Esgotado"; um
      # produto escondido SOME completamente até você desmarcar esta opção.
      # (Campo se chamava "arquivado"/"Arquivado" antes; renomeado para
      # refletir melhor o que a opção faz.)
      - {
          name: escondido,
          label: "Esconder do Cardápio",
          widget: boolean,
          default: false,
          hint: "Ligue para esconder este produto do site. Ele continua aqui, editável — é só reativar desligando esta opção depois.",
        }
      - {
          name: foto,
          label: "Foto",
          widget: image,
          required: false,
          # PROTECAO: so aceita formatos que o navegador exibe e que a
          # otimizacao consegue processar. Bloqueia HEIC (iPhone), etc.
          #
          # ATENCAO: "accept" e uma STRING separada por virgulas (igual ao
          # atributo accept do <input type="file"> do HTML), NAO uma lista.
          # Ja esteve como lista aqui e o painel parou de abrir em producao
          # com "The `accept` option must be a string" — ver
          # docs/BUGS-E-CORRECOES.md, item 9.
          accept: "image/jpeg,image/png,image/webp",
          hint: "Foto do doce (JPG, PNG ou WebP). Dica: proporção 4:3 na horizontal (ex.: 1200×900 px) fica certinha no molde do cardápio. Não é obrigatório — o sistema ajusta o tamanho e recorta o que passar. Fotos muito verticais ou quadradas podem ser cortadas nas bordas.",
        }

  # Categorias dos doces. O dono da loja cria aqui as categorias que aparecem no campo
  # "Categoria" de cada produto (widget relation). Assim ela pode adicionar
  # novos tipos de doce sem depender de alteracao no codigo.
  - name: categorias
    label: "Categorias"
    label_singular: "Categoria"
    description: "Categorias dos doces (ex.: Brownie, Brigadeiro). Crie novas conforme for vendendo outros tipos."
    folder: "src/content/categorias"
    create: true
    identifier_field: nome
    slug: "{{slug}}"
    fields:
      - { name: nome, label: "Nome", widget: string, hint: "Ex.: Bolo de Pote. É este texto que aparece na lista de categorias do produto." }
      # Cor da categoria (fundo do card, do chip e do detalhe do produto).
      # Campo em estilo BLOCO (sem chaves { }), igual ao "tipo" do cupom: uma
      # lista em bloco dentro de mapping em fluxo quebra o YAML e derruba o
      # painel (docs/BUGS-E-CORRECOES.md, item 2). Os valores batem com
      # CORES_CATEGORIA em src/content/categoria-schema.ts.
      - name: cor
        label: "Cor"
        widget: select
        required: false
        options:
          - { label: "Morango (rosa)", value: morango }
          - { label: "Caramelo (laranja-claro)", value: caramelo }
          - { label: "Cacau (marrom-claro)", value: cacau }
          - { label: "Baunilha (amarelo-claro)", value: baunilha }
          - { label: "Neutro (bege)", value: neutro }
        hint: "Opcional. Cor de fundo dos produtos desta categoria no cardápio. Se ficar em branco, o site escolhe uma cor automaticamente pela ordem das categorias."

  # Cupons de desconto. O dono da loja cria um codigo, escolhe o tipo (percentual ou
  # valor fixo), o valor e a validade. O cliente digita o codigo no carrinho.
  - name: cupons
    label: "Cupons"
    label_singular: "Cupom"
    description: "Cupons de desconto que o cliente digita no carrinho."
    folder: "src/content/cupons"
    create: true
    identifier_field: codigo
    slug: "{{codigo}}"
    fields:
      - { name: codigo, label: "Código", widget: string, hint: "Ex.: BEMVINDO10. O cliente digita este código no carrinho (não diferencia maiúsculas/minúsculas)." }
      # ATENCAO: campo em estilo BLOCO (sem as chaves { }). Uma lista em bloco
      # (options com "-") NAO pode ficar dentro de um mapping em fluxo { } —
      # isso quebra o parse do YAML e derruba o painel inteiro. Cada opcao pode
      # continuar em fluxo, pois um { } e valido como ITEM de uma lista.
      - name: tipo
        label: "Tipo de desconto"
        widget: select
        default: percentual
        options:
          - { label: "Percentual (%)", value: percentual }
          - { label: "Valor fixo (R$)", value: valor_fixo }
      - {
          name: valor,
          label: "Valor do desconto",
          widget: number,
          value_type: float,
          min: 0,
          step: 0.5,
          hint: "Percentual: 10 = 10% de desconto. Valor fixo: 5 = R$ 5,00 de desconto.",
        }
      # Data de validade. O widget "date" foi DEPRECADO/removido no Sveltia CMS
      # (e no Decap 3.0) — usar "date" derruba o painel. A forma suportada e o
      # widget "datetime" com "type: date" (data pura, sem horario). O "format"
      # garante que o valor gravado seja a string "YYYY-MM-DD".
      - name: validade
        label: "Validade"
        widget: datetime
        type: date
        format: "YYYY-MM-DD"
        hint: "O cupom vale até o fim deste dia (ou até a hora exata, se preencher o campo abaixo)."
      # Hora exata de expiracao (OPCIONAL). Usamos um campo de TEXTO simples
      # (widget string) DE PROPOSITO: e o widget mais a prova de falhas do CMS
      # (nao arrisca quebrar o painel como ja aconteceu com widgets de data). O
      # "pattern" valida o formato HH:MM na hora de salvar. Se ficar em branco, o
      # cupom vale o dia todo; se preenchida, expira nesse horario.
      #
      # ATENCAO: o "^$|" no INICIO do pattern e proposital. Sem ele, o painel
      # (Sveltia/Decap) valida o pattern MESMO em campo opcional vazio e
      # recusa salvar com "Use o formato HH:MM..." mesmo sem digitar nada —
      # bug conhecido herdado do Decap CMS. O "^$|" faz string vazia bater no
      # pattern tambem, sem enfraquecer a validacao do formato quando
      # preenchido. Ver docs/BUGS-E-CORRECOES.md, item 8.
      - {
          name: hora,
          label: "Hora de expiração (opcional)",
          widget: string,
          required: false,
          pattern: ["^$|^([01]?[0-9]|2[0-3]):[0-5][0-9]$", "Use o formato HH:MM, ex.: 14:30"],
          hint: "Opcional. Ex.: 14:30 → o cupom expira às 14h30 do dia da validade. Deixe em branco para valer o dia todo.",
        }
      # --- ANTES (quebrava o painel): widget: date depreciado. Mantido
      #     comentado para referencia.
      # - {
      #     name: validade,
      #     label: "Validade",
      #     widget: date,
      #     date_format: "DD/MM/YYYY",
      #     format: "YYYY-MM-DD",
      #     hint: "O cupom vale até o fim deste dia.",
      #   }

  # Configuracoes operacionais do site, editaveis pelo dono da loja. Collection do
  # tipo "files" do Sveltia/Decap: cada item aqui e um arquivo singular (nao
  # uma lista que o dono da loja cria/apaga, como produtos/cupons).
  - name: configuracoes
    label: "Configurações"
    description: "Ajustes operacionais do site."
    files:
      # Entrega e retirada: ligar/desligar cada opcao e definir a taxa de
      # entrega. Ver docs/CUPONS-E-PEDIDOS.md, secao "Entrega e retirada".
      - name: entrega
        label: "Entrega e Retirada"
        file: "src/content/configuracoes/entrega.json"
        description: "Ligue/desligue Entrega e Retirada e defina a taxa. As duas opções não podem ficar desligadas ao mesmo tempo — se isso acontecer, o site reativa a Retirada sozinho."
        fields:
          - { name: entrega_habilitada, label: "Entrega disponível", widget: boolean, default: true, hint: "Desligue para tirar a opção \"Entrega\" do carrinho do cliente." }
          - { name: retirada_habilitada, label: "Retirada disponível", widget: boolean, default: true, hint: "Desligue para tirar a opção \"Retirada\" do carrinho do cliente." }
          - {
              name: taxa_entrega,
              label: "Taxa de entrega (R$)",
              widget: number,
              value_type: float,
              min: 0,
              step: 0.5,
              default: 0,
              hint: "Somada ao total do pedido quando o cliente escolhe Entrega. Use 0 para entrega grátis. Ignorado se \"Taxa a combinar\" (abaixo) estiver ligado.",
            }
          - {
              name: taxa_a_combinar,
              label: "Taxa a combinar (em vez de um valor fixo)",
              widget: boolean,
              default: false,
              hint: "Ligue quando ainda não souber o valor do frete: mostra \"Taxa de entrega: A combinar\" para o cliente e na mensagem do WhatsApp, em vez de somar um valor ao total. Com isso ligado, o campo \"Taxa de entrega (R$)\" acima é ignorado.",
            }

      # Proxima fornada: banner opcional no topo do cardapio avisando quando
      # sera a proxima fornada. Ver docs/CUPONS-E-PEDIDOS.md, secao
      # "Proxima fornada".
      - name: fornada
        label: "Próxima Fornada"
        file: "src/content/configuracoes/fornada.json"
        description: "Banner no topo do cardápio avisando quando será a próxima fornada. A chave \"Mostrar banner\" abaixo desliga tudo de uma vez."
        fields:
          - {
              name: banner_habilitado,
              label: "Mostrar banner no site",
              widget: boolean,
              default: false,
              hint: "Chave geral: desligada, o banner some do site inteiro, não importa o que estiver preenchido abaixo.",
            }
          # ATENCAO: campo em estilo BLOCO (sem chaves { }), igual ao campo
          # "tipo" do cupom acima — uma lista em bloco (options com "-") NAO
          # pode ficar dentro de um mapping em fluxo { }, isso quebra o YAML
          # e derruba o painel inteiro (ver docs/BUGS-E-CORRECOES.md, item 2).
          - name: modo
            label: "O que mostrar"
            widget: select
            default: em_breve
            options:
              - { label: "Data e hora exatas", value: data }
              - { label: "Aviso genérico (\"em preparação\")", value: em_breve }
            hint: "Escolha \"Data e hora exatas\" quando já souber quando será a próxima fornada, ou \"Aviso genérico\" quando ainda não tiver uma data definida."
          # Mesma forma segura usada na validade do cupom acima: "datetime"
          # com "type: date" (o widget "date" foi removido do Sveltia/Decap
          # e derruba o painel — ver docs/BUGS-E-CORRECOES.md, item 3).
          - name: data
            label: "Data da próxima fornada"
            widget: datetime
            type: date
            format: "YYYY-MM-DD"
            required: false
            hint: "Só é usada quando \"O que mostrar\" (acima) está em \"Data e hora exatas\". Se ficar em branco nesse modo, o site mostra o aviso genérico em vez de uma data quebrada."
          # Hora opcional, mesmo campo de texto a prova de falhas do cupom
          # (widget: date/time teria o mesmo risco do item 3 acima). O "^$|"
          # no inicio do pattern deixa salvar em branco — sem ele, o painel
          # recusa o campo vazio mesmo sendo opcional (ver
          # docs/BUGS-E-CORRECOES.md, item 8).
          - {
              name: hora,
              label: "Hora (opcional)",
              widget: string,
              required: false,
              pattern: ["^$|^([01]?[0-9]|2[0-3]):[0-5][0-9]$", "Use o formato HH:MM, ex.: 14:30"],
              hint: "Opcional. Ex.: 14:30. Deixe em branco para mostrar só o dia, sem horário.",
            }

      # Pagina "Sobre": foto opcional, texto em tom pessoal e o rotulo do
      # botao que leva ao cardapio. Campos vazios somem da pagina.
      - name: sobre
        label: "Página Sobre"
        file: "src/content/configuracoes/sobre.json"
        description: "Conteúdo da página Sobre (/sobre). Tudo é opcional: o que ficar em branco não aparece no site."
        fields:
          - {
              name: foto,
              label: "Foto (opcional)",
              widget: image,
              required: false,
              # "accept" e STRING separada por virgulas, NAO lista — ver
              # docs/BUGS-E-CORRECOES.md, item 9.
              accept: "image/jpeg,image/png,image/webp",
              hint: "Uma foto sua, da equipe ou da loja. Funciona melhor na horizontal (4:3).",
            }
          - {
              name: texto,
              label: "Texto",
              widget: text,
              required: false,
              hint: "Conte um pouco da sua história, em tom pessoal. Deixe uma linha em branco entre os parágrafos.",
            }
          - {
              name: chamada,
              label: "Texto do botão para o cardápio",
              widget: string,
              required: false,
              hint: "Ex.: Ver o cardápio. Em branco, usa \"Ver Cardápio\".",
            }

      # Pagina "Contato": secao "Como encomendar". Cada campo vazio some; com
      # todos vazios, a secao inteira some.
      - name: contato
        label: "Página Contato"
        file: "src/content/configuracoes/contato.json"
        description: "Seção \"Como encomendar\" da página Contato (/contato). O que ficar em branco não aparece no site."
        fields:
          - { name: antecedencia, label: "Antecedência", widget: text, required: false, hint: "Ex.: Faça seu pedido com pelo menos 2 dias de antecedência." }
          - { name: regiao_entrega, label: "Região de entrega", widget: text, required: false, hint: "Ex.: Entregamos no Centro e bairros vizinhos." }
          - { name: retirada, label: "Retirada", widget: text, required: false, hint: "Ex.: Retirada no ateliê, de terça a sábado, das 9h às 18h." }
          - { name: pagamento, label: "Formas de pagamento", widget: text, required: false, hint: "Ex.: Pix, cartão ou dinheiro." }

      # Rodape: horario de pedidos (liga/desliga + texto) e redes sociais.
      # As redes sao uma LISTA: o dono da loja escolhe a rede, cola o link e
      # liga/desliga cada uma. O link e OBRIGATORIO e precisa comecar com
      # https:// (o pattern abaixo) — sem link a rede nao pode ser salva, e o
      # site ainda ignora qualquer item sem link valido (rodape-schema.ts).
      # ATENCAO: campos com "options"/"fields" em lista ficam em estilo BLOCO
      # (sem chaves { }): lista em bloco dentro de mapping em fluxo quebra o
      # YAML e derruba o painel (docs/BUGS-E-CORRECOES.md, item 2).
      - name: rodape
        label: "Rodapé"
        file: "src/content/configuracoes/rodape.json"
        description: "Horário de pedidos e redes sociais que aparecem no rodapé de todas as páginas (as redes também aparecem na página Contato)."
        fields:
          - {
              name: horario_habilitado,
              label: "Mostrar horário de pedidos",
              widget: boolean,
              default: true,
              hint: "Desligue para esconder a linha de horário do rodapé (os dias e horas abaixo continuam salvos).",
            }
          # O TEXTO do horario e fixo ("Pedidos de terça a sábado, das 9h às
          # 18h"), montado em src/content/rodape-schema.ts (textoHorario) a
          # partir destes quatro menus — sem campo de texto livre.
          # ANTES: campo de texto livre "horario" (widget string). Para voltar,
          # recoloque-o aqui e, em rodape-schema.ts, volte horarioVisivel a ler
          # config.horario (a linha antiga esta comentada la).
          - name: dia_inicio
            label: "Pedidos a partir de (dia)"
            widget: select
            default: "terca"
            options:
              - { label: "Segunda-feira", value: "segunda" }
              - { label: "Terça-feira", value: "terca" }
              - { label: "Quarta-feira", value: "quarta" }
              - { label: "Quinta-feira", value: "quinta" }
              - { label: "Sexta-feira", value: "sexta" }
              - { label: "Sábado", value: "sabado" }
              - { label: "Domingo", value: "domingo" }
            hint: "Primeiro dia da semana em que você recebe pedidos."
          - name: dia_fim
            label: "Até (dia)"
            widget: select
            default: "sabado"
            options:
              - { label: "Segunda-feira", value: "segunda" }
              - { label: "Terça-feira", value: "terca" }
              - { label: "Quarta-feira", value: "quarta" }
              - { label: "Quinta-feira", value: "quinta" }
              - { label: "Sexta-feira", value: "sexta" }
              - { label: "Sábado", value: "sabado" }
              - { label: "Domingo", value: "domingo" }
            hint: "Último dia. Igual ao primeiro: \"Pedidos às terças\" (ou \"aos sábados\"). De segunda a domingo: \"Pedidos todos os dias\"."
          - name: hora_inicio
            label: "Das (hora)"
            widget: select
            default: "09:00"
            options:
              - { label: "0h", value: "00:00" }
              - { label: "0h30", value: "00:30" }
              - { label: "1h", value: "01:00" }
              - { label: "1h30", value: "01:30" }
              - { label: "2h", value: "02:00" }
              - { label: "2h30", value: "02:30" }
              - { label: "3h", value: "03:00" }
              - { label: "3h30", value: "03:30" }
              - { label: "4h", value: "04:00" }
              - { label: "4h30", value: "04:30" }
              - { label: "5h", value: "05:00" }
              - { label: "5h30", value: "05:30" }
              - { label: "6h", value: "06:00" }
              - { label: "6h30", value: "06:30" }
              - { label: "7h", value: "07:00" }
              - { label: "7h30", value: "07:30" }
              - { label: "8h", value: "08:00" }
              - { label: "8h30", value: "08:30" }
              - { label: "9h", value: "09:00" }
              - { label: "9h30", value: "09:30" }
              - { label: "10h", value: "10:00" }
              - { label: "10h30", value: "10:30" }
              - { label: "11h", value: "11:00" }
              - { label: "11h30", value: "11:30" }
              - { label: "12h", value: "12:00" }
              - { label: "12h30", value: "12:30" }
              - { label: "13h", value: "13:00" }
              - { label: "13h30", value: "13:30" }
              - { label: "14h", value: "14:00" }
              - { label: "14h30", value: "14:30" }
              - { label: "15h", value: "15:00" }
              - { label: "15h30", value: "15:30" }
              - { label: "16h", value: "16:00" }
              - { label: "16h30", value: "16:30" }
              - { label: "17h", value: "17:00" }
              - { label: "17h30", value: "17:30" }
              - { label: "18h", value: "18:00" }
              - { label: "18h30", value: "18:30" }
              - { label: "19h", value: "19:00" }
              - { label: "19h30", value: "19:30" }
              - { label: "20h", value: "20:00" }
              - { label: "20h30", value: "20:30" }
              - { label: "21h", value: "21:00" }
              - { label: "21h30", value: "21:30" }
              - { label: "22h", value: "22:00" }
              - { label: "22h30", value: "22:30" }
              - { label: "23h", value: "23:00" }
              - { label: "23h30", value: "23:30" }
            hint: "Horário em que começa a receber pedidos."
