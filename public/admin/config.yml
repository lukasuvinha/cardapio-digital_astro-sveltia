          - name: redes
            label: "Redes sociais"
            label_singular: "rede social"
            widget: list
            required: false
            summary: "{{fields.rede}} — {{fields.url}}"
            hint: "Adicione as redes da loja. Cada uma precisa do link do perfil; use a chave \"Mostrar no site\" para esconder uma rede sem apagar."
            fields:
              - name: rede
                label: "Rede"
                widget: select
                options:
                  - { label: "Instagram", value: instagram }
                  - { label: "TikTok", value: tiktok }
                  - { label: "Facebook", value: facebook }
                  - { label: "Pinterest", value: pinterest }
                  - { label: "X (Twitter)", value: x }
                  - { label: "YouTube", value: youtube }
                  - { label: "Threads", value: threads }
              - name: url
                label: "Link do perfil"
                widget: string
                pattern: ["^https?://[^\\s/]+\\.[^\\s]+$", "Cole o link completo do perfil, começando com https:// (ex.: https://www.instagram.com/minhaloja)"]
                hint: "Obrigatório. Abra seu perfil na rede, copie o endereço e cole aqui."
              - {
                  name: ativo,
                  label: "Mostrar no site",
                  widget: boolean,
                  default: true,
                }

